<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务系统代理页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f5f5f5;
        }
        .toolbar {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar h3 {
            margin: 0;
            font-size: 16px;
        }
        .toolbar button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .toolbar button:hover {
            background: rgba(255,255,255,0.3);
        }
        #status {
            background: #cce5ff;
            color: #004085;
            padding: 8px 20px;
            font-size: 14px;
            display: none;
        }
        iframe {
            flex: 1;
            border: none;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h3>📚 学校教务系统</h3>
        <div>
            <button onclick="notifyReady()">✅ 已登录</button>
            <button onclick="startExtract()">🔍 提取课表</button>
        </div>
    </div>
    <div id="status"></div>
    <iframe id="webview" src=""></iframe>

    <script>
        // 从 URL 参数获取登录地址
        const urlParams = new URLSearchParams(window.location.search);
        const loginUrl = urlParams.get('url');
        const schoolId = urlParams.get('school');

        // DOM 元素
        const webview = document.getElementById('webview');
        const status = document.getElementById('status');

        // 学校配置
        let schoolConfig = null;

        // 初始化
        async function init() {
            console.log('[Proxy] 初始化...');
            console.log('[Proxy] 登录地址:', loginUrl);
            console.log('[Proxy] 学校 ID:', schoolId);

            if (!loginUrl) {
                showStatus('错误: 未提供登录地址', 'error');
                return;
            }

            // 加载学校配置
            try {
                const response = await fetch('https://raw.githubusercontent.com/cjz-wr/PlanCraftDownload/main/rules_index.json');
                const data = await response.json();
                schoolConfig = data.schools.find(s => s.id === schoolId);
                console.log('[Proxy] 学校配置:', schoolConfig);
            } catch (error) {
                console.error('[Proxy] 加载学校配置失败:', error);
            }

            // 加载教务系统页面
            webview.src = loginUrl;
            showStatus('正在加载教务系统页面...', 'info');
        }

        // 显示状态
        function showStatus(message, type) {
            status.textContent = message;
            status.style.display = 'block';
            
            if (type === 'error') {
                status.style.background = '#f8d7da';
                status.style.color = '#721c24';
            } else if (type === 'success') {
                status.style.background = '#d4edda';
                status.style.color = '#155724';
            } else {
                status.style.background = '#cce5ff';
                status.style.color = '#004085';
            }

            // 3秒后自动隐藏
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // 通知父页面已就绪
        function notifyReady() {
            console.log('[Proxy] 通知父页面已就绪');
            if (window.opener) {
                window.opener.postMessage({
                    type: 'EXTRACTOR_READY',
                    url: window.location.href
                }, '*');
                showStatus('已通知主页面，可以点击"智能一键识别课表"', 'success');
            }
        }

        // 开始提取
        function startExtract() {
            console.log('[Proxy] 开始提取课表');
            
            if (!schoolConfig) {
                showStatus('错误: 未加载学校配置', 'error');
                return;
            }

            showStatus('正在提取课表数据...', 'info');

            // 加载并执行学校脚本
            const scriptUrl = schoolConfig.urls.github_raw_js;
            console.log('[Proxy] 加载脚本:', scriptUrl);

            fetch(scriptUrl)
                .then(response => response.text())
                .then(scriptText => {
                    console.log('[Proxy] 脚本加载成功，开始执行...');
                    
                    // 执行脚本
                    const scriptFunction = new Function(`
                        return new Promise((resolve, reject) => {
                            try {
                                window.__courseDataCallback = function(data) {
                                    resolve(data);
                                };
                                ${scriptText}
                                if (typeof window.__courseData !== 'undefined') {
                                    resolve(window.__courseData);
                                }
                            } catch (error) {
                                reject(error);
                            }
                        });
                    `);

                    return scriptFunction();
                })
                .then(courseData => {
                    console.log('[Proxy] 提取到课程数据:', courseData);
                    
                    // 发送数据到父页面
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'COURSE_DATA',
                            payload: courseData
                        }, '*');
                        showStatus('课表提取成功！请返回主页面继续操作。', 'success');
                    }
                })
                .catch(error => {
                    console.error('[Proxy] 提取失败:', error);
                    showStatus('提取失败: ' + error.message, 'error');
                });
        }

        // 监听来自父页面的消息
        window.addEventListener('message', function(event) {
            console.log('[Proxy] 收到消息:', event.data);
            
            if (event.data && event.data.type === 'START_EXTRACTION') {
                startExtract();
            }
        });

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
